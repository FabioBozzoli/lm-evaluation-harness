# steer_text (linear regime + block_ridge) on math, cross-family: Llama-3.2-3B-Instruct
# -> Llama-3.2-3B_math corrects meta-llama/Llama-3.1-1b's lm_head input at every
# position. Source has fewer blocks than target (28 vs 32), so it's B's 32 blocks that
# get grouped down to 28 (block_group_strategy: concat) to match A's.
#
# BLOCKING PREREQUISITE -- not yet resolved as of this conversation, do not submit until
# it is: Llama-3.2-3B_math's embed_tokens/lm_head (tied) has vocab_size=128320, 64 rows
# more than the base 128256 Llama-3.x vocabulary; Llama-3.1-1b's own vocab is the
# standard 128256 (untied lm_head). Stage 1 combines A's and B's head-projected logits
# in one equation (w_a.T next to w_b.T, see steer_text.py's _stage1_projection), which
# requires equal vocab width -- prepare() will crash on that subtraction's shape
# mismatch until the 64 extra rows are either confirmed genuinely trained (steer_text
# cannot use this checkpoint at all, use theseus instead) or trimmed back to 128256 (if
# they turn out to be dead/never-trained padding). Run the extra-row norm/uniqueness
# diagnostic discussed earlier in this conversation first.
#
# Memory -- calculated, not measured; see the sibling theseus config for the same
# caveat and its RAM breakdown (this method's CPU cost is much lower, see below):
# - VRAM: same ~29 GB base as theseus (B 1b bf16 + the two 3B-family sources bf16),
#   plus the linear regime's forward-mode-AD (jvp) overhead, run on the *source* (3B)
#   model, one block at a time. This exact combination (1b target, jvp source) has not
#   been run before -- recommend 96 GB; resubmit with
#   --constraint=gpu_RTXPro6000B_96G if a 45 GB card OOMs.
# - RAM: dominated by cached calibration features (float64, sized by calib_samples x
#   tokens x hidden x num_blocks), not by theseus-sized covariance matrices -- roughly
#   15-25 GB at the calib_samples below. Rounded up generously to 96 GB below.
#
# TODO: set source_finetuned to the Llama-3.2-3B_math directory on the cluster
# (Hugging Face format). meta-llama repos are gated: see the HF token note in the
# matching sbatch script.

model: rebased
model_args:
  pretrained: meta-llama/Llama-3.2-1b
  dtype: bfloat16
  source_pretrained: meta-llama/Llama-3.2-3B-Instruct
  source_finetuned: /work/intesasanpaolo_phd/lm-eval/checkpoints/Llama-3.2-3B_math  # TODO
  method: steer_text
  alpha: 1.0

  calib_dataset: hkust-nlp/dart-math-hard
  calib_config: default
  calib_fields: query+response
  calib_samples: 16
  calib_test_samples: 4
  calib_max_length: 256
  calib_batch_size: 2

  feature_regime: standard
  stage_2_strategy: global_mlp
  block_group_strategy: concat
  block_ridge_mode: independent
  total_support_examples: 2048
  stage1_lambda: 1.0
  ridge_lambda: 1.0
  feature_cache_dir: /work/intesasanpaolo_phd/lm-eval/.cache/steer_text_features
  force_recompute_features: false
  seed: 42

tasks: [gsm8k]
batch_size: 4
device: cuda
log_samples: true
