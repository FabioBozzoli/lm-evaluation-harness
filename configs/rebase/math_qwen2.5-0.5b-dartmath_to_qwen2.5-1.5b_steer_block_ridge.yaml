# steer_text (linear regime + block_ridge) on math: correction fit on DART-Math token
# positions, applied to Qwen2.5-1.5B's lm_head input while generating GSM8K answers.
#
# TODO: set source_finetuned to your DART-Math finetune of Qwen/Qwen2.5-0.5B (Hugging Face
# model directory, see the theseus math config).
# For the cheaper path use feature_regime: standard + stage_2_strategy: global_ridge.

model: rebased
model_args:
  pretrained: Qwen/Qwen2.5-1.5B
  dtype: bfloat16
  source_pretrained: Qwen/Qwen2.5-0.5B
  source_finetuned: /work/tesi_bcalderara/merge-and-rebase/checkpoints/qwen2.5-0.5b-dart-math  # TODO
  method: steer_text
  alpha: 1.0

  calib_dataset: hkust-nlp/dart-math-hard
  calib_config: default
  calib_fields: query+response
  calib_samples: 16
  calib_test_samples: 4
  calib_max_length: 256
  calib_batch_size: 2

  feature_regime: linear
  stage_2_strategy: block_ridge
  block_group_strategy: concat
  block_ridge_mode: independent
  total_support_examples: 2048
  stage1_lambda: 1.0
  ridge_lambda: 1.0
  feature_cache_dir: .cache/steer_text_features
  force_recompute_features: false
  seed: 42

tasks: [gsm8k]
batch_size: 8
device: cuda
log_samples: true
