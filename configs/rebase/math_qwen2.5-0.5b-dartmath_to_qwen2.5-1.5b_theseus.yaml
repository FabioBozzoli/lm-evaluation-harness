# theseus on math: the task vector of a Qwen2.5-0.5B finetuned on DART-Math,
# transported into Qwen2.5-1.5B and evaluated on GSM8K.
#
# TODO: set source_finetuned to your DART-Math finetune of Qwen/Qwen2.5-0.5B. It must be
# a Hugging Face model directory (model.save_pretrained / a Hub id): the wrapper loads it
# with AutoModelForCausalLM.from_pretrained, so a raw .pt state dict has to be exported
# first. No public 0.5B Qwen2.5 math finetune exists to use instead.
#
# Memory: ~30 GB of CPU RAM for the theseus covariances, as in the code config.

model: rebased
model_args:
  pretrained: Qwen/Qwen2.5-1.5B
  dtype: bfloat16
  source_pretrained: Qwen/Qwen2.5-0.5B
  source_finetuned: /work/tesi_bcalderara/merge-and-rebase/checkpoints/qwen2.5-0.5b-dart-math  # TODO
  method: theseus
  alpha: 1.0

  calib_dataset: hkust-nlp/dart-math-hard
  calib_config: default
  calib_fields: query+response
  calib_samples: 64
  calib_max_length: 512
  calib_batch_size: 4

  covariance_mode: activations
  whiten_power: 0.0
  center_acts: false
  seed: 42

tasks: [gsm8k]
batch_size: 8
device: cuda
log_samples: true
